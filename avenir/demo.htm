    <title>AVENIR - Responsive Coming Soon Template</title>
    <!--  Disable screen scaling-->
    <meta name='viewport' content='width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1, user-scalable=0'>
    <meta name='author' content='mirado.work digital agency'>
    <meta name='description' content='Avenir, a responsive Coming Soon Template'>
    <!-- Load webfonts -->
    <link rel='stylesheet' id='font-css' href='fonts/bebasneue/stylesheet.css' type='text/css' media='all'>
    <link rel='stylesheet' id='font-css' href='fonts/adam/stylesheet.css' type='text/css' media='all'>

    <link rel='stylesheet' type='text/css' href='css/normalize.css' />
    <!-- Load css -->
    <link rel='stylesheet' type='text/css' href='css/foundation.min.css' />
</head>
<style>
    body, header, h2, h3, h4, h5,p{     
        font-family: 'bebasneue_book';
    }
    body{    
        background: #f4f5f8;
    }
    .all{
        position: absolute;
        width: 100%;
    }
    header h2{
        padding-top: 1em;
        padding-left: 1em;
        padding-right: 1em;
        color: #575d69;
        margin-bottom: 5%;
        display: block;        
        
    }
    .select{
        margin-bottom: 5%; 
    }
    span.marked{
       color: #6d9eb4;
        font-family: 'bebasneue_regular';
    }
    ul, li{
        list-style: none;
    }
    ul li{
        margin-bottom: 1rem;   
    }
    ul li a{
        box-sizing: border-box;
        display: block;
        padding: 0.7rem;
        background: #fff;
        
        -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,0.5),
            0 2px 2px rgba(0,0,0,0.2),
            0 0 4px 1px rgba(0,0,0,0.1);
        -moz-box-shadow: inset 0 1px 0 rgba(255,255,255,0.5),
            0 2px 2px rgba(0,0,0,0.2),
            0 0 4px 1px rgba(0,0,0,0.1);
        -ms-box-shadow: inset 0 1px 0 rgba(255,255,255,0.5),
            0 2px 2px rgba(0,0,0,0.2),
            0 0 4px 1px rgba(0,0,0,0.1);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.5),
            0 2px 2px rgba(0,0,0,0.2),
            0 0 4px 1px rgba(0,0,0,0.1);
        border-radius: 0.2rem;
    
    }
    ul li a h4{
        font-family: 'bebasneue_regular';
        color: #575d69;
    }
    ul li a{        
        -ms-transition: 0.3s;
        -moz-transition: 0.3s;
        -webkit-transition: 0.3s;
        transition: 0.3s;
    }
    ul li a:hover{
        -webkit-transform: scale(1.07);
        -ms-transform: scale(1.07);
        -moz-transform: scale(1.07);
        transform: scale(1.07);
    }
</style>
<body>
    <section class='all'>
        <header class=' text-center'>
            <h2><span class='marked'>Avenir</span> – A Responsive Coming Soon Template</h3>
        </header>

        <section>
            <h3 class='text-center select'>- Select one -</h3>
            <ul class='row'>
                <li class='columns medium-4 small-6'>
                    <a href='index.htm'>
                        <div>
                            <img src='./screenshoot/default_square.jpg' alt='Default'>
                        </div>
                        <h4 class='text-center'>Default</h4>
                    </a>
                </li>
                <li class='columns medium-4 small-6'>
                    <a href='index_custom.htm'>
                        <div>
                            <img src='./screenshoot/custom_square.jpg' alt='Custom'>
                        </div>
                        <h4 class='text-center'>Customized</h4>
                    </a>
                </li>
                <li class='columns small-3 hide-for-medium-up'></li>
                <li class='columns medium-4 small-6'>
                    <a href='index_video.htm'>
                        <div>
                            <img src='./screenshoot/video_square.jpg' alt='Video'>
                        </div>
                        <h4 class='text-center'>Video Background</h4>
                    </a>
                </li>
                <li class='columns small-3 hide-for-medium-up'></li>
            </ul>

        </section>
    </section>
    
</body>
